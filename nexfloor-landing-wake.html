<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Archivo+Narrow:wght@400;500;700&display=swap" rel="stylesheet" />

<div id="nxf-root">
<style type="text/css">

/* ---- AmsiPro Cond — trocar os src pelos arquivos reais quando chegarem.
        Ate la, o fallback condensado abaixo assume. ---- */
@font-face {
  font-family: 'AmsiPro Cond';
  font-weight: 900;
  font-display: swap;
  src: local('Oswald');
}

/* ---- Tokens + reset raiz ---- */
#nxf-root {
  --roxo:       #7B529F;
  --roxo-claro: #af619e;
  --azul:       #599ad5;
  --friso-1:    #FFCC00;
  --friso-2:    #FFED00;
  --ink:        #1f1f1f;
  --creme:      #f6f3ef;
  --branco:     #fff;

  --title: 'Oswald','AmsiPro Cond',system-ui,sans-serif;
  --body:  'Archivo Narrow','AmsiPro Cond',system-ui,sans-serif;

  font-family: var(--body);
  color: var(--ink);
  background: var(--branco);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

#nxf-root *, #nxf-root *::before, #nxf-root *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

#nxf-root img   { display: block; max-width: 100%; }
#nxf-root a     { color: inherit; text-decoration: none; }
#nxf-root button{ font-family: inherit; cursor: pointer; }

/* ---- Container ---- */
#nxf-root .wrap {
  width: 100%;
  max-width: 1432px;
  margin-inline: auto;
  padding-inline: clamp(16px, 4vw, 60px);
}

/* ---- Topbar ---- */
#nxf-root .nxf-topbar {
  background: var(--roxo);
  color: var(--branco);
}

#nxf-root .nxf-topbar__in {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-block: 8px;
  font-family: var(--title);
  font-size: clamp(11px, 1.4vw, 13px);
  text-transform: uppercase;
  letter-spacing: .04em;
}

@media (max-width: 560px) {
  #nxf-root .nxf-topbar__seal { display: none; }
}

</style>

<!-- ---- Topbar ---- -->
<div class="nxf-topbar"><div class="wrap nxf-topbar__in">
  <span>Linha Propiso &bull; Cristal</span>
  <span class="nxf-topbar__seal">Piso decorativo que reproduz granito</span>
</div></div>

<!-- secoes entram aqui -->

</div><!-- /#nxf-root -->
