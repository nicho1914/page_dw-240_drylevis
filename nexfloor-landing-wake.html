<!-- ============================================================================
     BLOCO LANDING PAGE - NEX FLOOR (LINHA PROPISO) - FRAGMENTO WAKE
     Cole TUDO isto num bloco de conteúdo HTML do Wake (modo código-fonte).
     - Sem <html>/<head>/<body> (é um fragmento Wake).
     - CSS escopado em #nxf-root (nao afeta o tema da loja).
     - Acentos como entidades HTML; JS (quando houver) em ASCII puro.
     - Fontes: AmsiPro Cond via @font-face (trocar src quando os arquivos
       chegarem). Ate la, Oswald + Archivo Narrow (Google Fonts) assumem.
     - Assets de imagem/video via CDN externo; nunca .mp4 direto no Wake.
     Produto: landing Nex Floor / linha Propiso
     Versao: v3 — S1 reset + hero PDP (banner img + seletor/stepper/comprar)
============================================================================ -->

<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700;900&family=Archivo+Narrow:wght@400;500;700&display=swap" rel="stylesheet" />

<div id="nxf-root">
<style>

/* ---- AmsiPro Cond — trocar os src pelos arquivos reais quando chegarem.
        Ate la, o fallback condensado abaixo assume. ---- */
@font-face {
  font-family: 'AmsiPro Cond';
  font-weight: 900;
  font-display: swap;
  src: local('Oswald');
}

/* ---- Tokens ---- */
#nxf-root {
  --roxo:      #7b529f;
  --ink2:      #242424;
  --gray:      #696969;
  --lilas:     #f4eff8;
  --friso-1:   #ffcc00;
  --navy2:     #253161;
  --cinza:     #878787;
  --chip-bg:   #f1f1f1;
  --chip-ink:  #858585;
  --sub:       #767676;
  --branco:    #fff;
  --ink:       #1f1f1f;
  --creme:     #f6f3ef;
  --verde:     #4f9d43;
  --title: 'Oswald','AmsiPro Cond',system-ui,sans-serif;
  --body:  'Archivo Narrow','AmsiPro Cond',system-ui,sans-serif;

  font-family: var(--body);
  color: var(--ink);
  background: var(--branco);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  width: 100%;
  max-width: 100%;
}

/* ---- Universal reset ---- */
#nxf-root *, #nxf-root *::before, #nxf-root *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* ---- Base rules ---- */
#nxf-root img    { display: block; max-width: 100%; }
#nxf-root a      { color: inherit; text-decoration: none; }
#nxf-root button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ---- Container ---- */
#nxf-root .wrap {
  max-width: 1512px;
  margin-inline: auto;
  padding-inline: clamp(16px, 4vw, 80px);
}

/* ================================================================
   HERO — banner bg + overlay PDP controls (right column)
   ================================================================ */

#nxf-root .nxf-hero {
  position: relative;
  width: 100%;
  aspect-ratio: 1512 / 795;
  background-color: #1f3f9e;
  overflow: hidden;
}

#nxf-root .nxf-hero__bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

/* Right overlay column — sits on top of the banner image */
#nxf-root .nxf-hero__overlay {
  position: absolute;
  top: 0;
  right: 0;
  width: 47%;
  height: 100%;
  display: flex;
  align-items: center;
  padding: clamp(20px, 3vw, 56px) clamp(20px, 3.5vw, 64px) clamp(20px, 3vw, 56px) clamp(16px, 2vw, 32px);
}

#nxf-root .nxf-hero__col {
  display: flex;
  flex-direction: column;
  gap: clamp(12px, 1.6vw, 22px);
  width: 100%;
}

/* --- Title block --- */
#nxf-root .nxf-hero__title {
  font-family: var(--title);
  font-weight: 900;
  font-size: clamp(22px, 3.2vw, 48px);
  line-height: 1;
  text-transform: uppercase;
  color: var(--branco);
  text-align: center;
}

#nxf-root .nxf-hero__subtitle {
  font-family: var(--body);
  font-weight: 700;
  font-size: clamp(11px, 1.6vw, 24px);
  line-height: 1.1;
  text-transform: uppercase;
  color: var(--branco);
}

/* --- Escolha heading --- */
#nxf-root .nxf-hero__escolha-heading {
  font-family: var(--title);
  font-weight: 900;
  font-size: clamp(20px, 2.8vw, 48px);
  line-height: 1;
  text-transform: uppercase;
  color: var(--branco);
  text-align: center;
}

#nxf-root .nxf-hero__escolha-desc {
  font-family: var(--body);
  font-weight: 700;
  font-size: clamp(11px, 1.4vw, 24px);
  line-height: 1.2;
  text-transform: uppercase;
  color: var(--branco);
}

/* --- Product option cards --- */
#nxf-root .nxf-hero__options {
  display: flex;
  flex-direction: column;
  gap: clamp(8px, 1vw, 14px);
}

#nxf-root .nxf-hero__option {
  display: flex;
  align-items: center;
  gap: clamp(10px, 1.4vw, 21px);
  padding: clamp(10px, 1.8vw, 26px) clamp(14px, 2.6vw, 39px);
  border: 1.5px solid rgba(255,255,255,0.45);
  border-radius: 25px;
  cursor: pointer;
  transition: border-color 0.18s, background 0.18s;
  background: transparent;
  width: 100%;
  text-align: left;
}

#nxf-root .nxf-hero__option[aria-checked="true"] {
  border-color: var(--branco);
  background: rgba(255,255,255,0.08);
}

/* Radio circle */
#nxf-root .nxf-hero__radio {
  flex-shrink: 0;
  width: clamp(14px, 1.4vw, 20px);
  height: clamp(14px, 1.4vw, 20px);
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.18s;
}

#nxf-root .nxf-hero__option[aria-checked="true"] .nxf-hero__radio {
  border-color: var(--branco);
}

#nxf-root .nxf-hero__radio-dot {
  width: 55%;
  height: 55%;
  border-radius: 50%;
  background: var(--branco);
  opacity: 0;
  transition: opacity 0.18s;
}

#nxf-root .nxf-hero__option[aria-checked="true"] .nxf-hero__radio-dot {
  opacity: 1;
}

#nxf-root .nxf-hero__option-label {
  font-family: var(--title);
  font-weight: 900;
  font-size: clamp(12px, 1.6vw, 24px);
  line-height: 1;
  text-transform: uppercase;
  color: var(--branco);
  flex: 1;
  text-align: center;
}

/* --- Stepper + Comprar row --- */
#nxf-root .nxf-hero__actions {
  display: flex;
  gap: clamp(8px, 1.2vw, 16px);
  align-items: stretch;
}

#nxf-root .nxf-hero__stepper {
  display: flex;
  align-items: center;
  gap: clamp(8px, 1.2vw, 25px);
  padding: clamp(6px, 0.6vw, 8px) clamp(12px, 1.6vw, 24px);
  border: 1.5px solid var(--branco);
  border-radius: 8px;
  flex-shrink: 0;
}

#nxf-root .nxf-hero__stepper-btn {
  font-family: var(--title);
  font-weight: 900;
  font-size: clamp(16px, 1.6vw, 24px);
  color: var(--branco);
  background: none;
  border: none;
  cursor: pointer;
  line-height: 1;
  padding: 0 2px;
  transition: opacity 0.15s;
  -webkit-user-select: none;
  user-select: none;
}

#nxf-root .nxf-hero__stepper-btn:hover { opacity: 0.7; }

#nxf-root .nxf-hero__stepper-num {
  font-family: var(--title);
  font-weight: 900;
  font-size: clamp(16px, 1.6vw, 24px);
  color: var(--branco);
  text-transform: uppercase;
  min-width: clamp(14px, 1.2vw, 20px);
  text-align: center;
  line-height: 1;
}

#nxf-root .nxf-hero__comprar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(6px, 0.8vw, 12px);
  flex: 1;
  padding: clamp(6px, 0.6vw, 8px) clamp(14px, 1.6vw, 24px);
  background: var(--verde);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: filter 0.18s;
}

#nxf-root .nxf-hero__comprar:hover { filter: brightness(1.1); }

#nxf-root .nxf-hero__comprar-label {
  font-family: var(--title);
  font-weight: 900;
  font-size: clamp(14px, 1.6vw, 24px);
  line-height: 1;
  text-transform: uppercase;
  color: var(--branco);
}

#nxf-root .nxf-hero__comprar-chevron {
  font-size: clamp(16px, 1.8vw, 26px);
  color: var(--branco);
  line-height: 1;
  flex-shrink: 0;
}

/* --- Carousel arrow buttons (bottom-right of hero) --- */
#nxf-root .nxf-hero__arrows {
  position: absolute;
  bottom: clamp(14px, 2vw, 28px);
  right: clamp(16px, 2.5vw, 40px);
  display: flex;
  gap: clamp(8px, 0.8vw, 12px);
  z-index: 10;
}

#nxf-root .nxf-hero__arrow {
  width: clamp(32px, 3vw, 44px);
  height: clamp(32px, 3vw, 44px);
  border-radius: 50%;
  background: rgba(255,255,255,0.22);
  border: 1.5px solid rgba(255,255,255,0.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.18s;
  color: var(--branco);
  font-size: clamp(14px, 1.4vw, 20px);
  font-family: var(--title);
  font-weight: 900;
  line-height: 1;
}

#nxf-root .nxf-hero__arrow:hover { background: rgba(255,255,255,0.38); }

/* ================================================================
   RESPONSIVE — mobile stacked layout
   ================================================================ */
@media (max-width: 860px) {
  #nxf-root .nxf-hero {
    aspect-ratio: auto;
    display: flex;
    flex-direction: column;
    overflow: visible;
    background-color: #1f3f9e;
    min-height: 0;
  }

  #nxf-root .nxf-hero__bg {
    position: relative;
    width: 100%;
    height: auto;
    aspect-ratio: 1512 / 795;
    object-fit: cover;
    flex-shrink: 0;
    max-height: 54vw;
  }

  #nxf-root .nxf-hero__overlay {
    position: relative;
    top: auto;
    right: auto;
    width: 100%;
    height: auto;
    padding: clamp(20px, 5vw, 40px) clamp(16px, 5vw, 32px);
    background: #1f3f9e;
    align-items: flex-start;
  }

  #nxf-root .nxf-hero__col {
    gap: clamp(14px, 4vw, 24px);
  }

  #nxf-root .nxf-hero__title {
    font-size: clamp(24px, 7vw, 38px);
  }

  #nxf-root .nxf-hero__subtitle {
    font-size: clamp(13px, 3.5vw, 20px);
  }

  #nxf-root .nxf-hero__escolha-heading {
    font-size: clamp(22px, 6vw, 36px);
  }

  #nxf-root .nxf-hero__escolha-desc {
    font-size: clamp(12px, 3vw, 18px);
  }

  #nxf-root .nxf-hero__option {
    border-radius: 16px;
    padding: 14px 18px;
  }

  #nxf-root .nxf-hero__option-label {
    font-size: clamp(13px, 3.5vw, 20px);
  }

  #nxf-root .nxf-hero__actions {
    flex-direction: column;
    gap: 10px;
  }

  #nxf-root .nxf-hero__stepper {
    justify-content: center;
  }

  #nxf-root .nxf-hero__arrows {
    position: static;
    justify-content: flex-end;
    margin-top: 8px;
  }
}

</style>

<!-- ============================================================
     HERO — banner PDP com controles sobrepostos
     ============================================================ -->
<section class="nxf-hero" aria-label="Nex Floor Nivela &amp; Primer">

  <!-- Banner background image (bucket on left baked into image) -->
  <img
    class="nxf-hero__bg"
    src="https://cdn.jsdelivr.net/gh/nicho1914/page_dw-240_drylevis@main/Assets/nexfloor-hero-banner.png"
    alt="Nex Floor Nivela &amp; Primer — balde Cristal sobre fundo azul"
    loading="eager"
    decoding="async"
    width="1512"
    height="795"
  />

  <!-- Right overlay — all live PDP controls -->
  <div class="nxf-hero__overlay">
    <div class="nxf-hero__col">

      <!-- 1. Title block -->
      <div>
        <p class="nxf-hero__title">Nex Flor Nivela &amp; Primer</p>
        <p class="nxf-hero__subtitle">Nex flor granito l&iacute;quido, Nex flor granito l&iacute;quido, Nex flor granito l&iacute;quido</p>
      </div>

      <!-- 2. Escolha seu produto heading + desc -->
      <div>
        <p class="nxf-hero__escolha-heading">Escolha seu produto</p>
        <p class="nxf-hero__escolha-desc">Voc&ecirc; escolhe seu produto ou kit para aproveitar com desconto toda a solu&ccedil;&atilde;o do nex floor!</p>
      </div>

      <!-- 3. Product option cards (radiogroup) -->
      <div class="nxf-hero__options" role="radiogroup" aria-label="Op&ccedil;&atilde;o de produto">

        <button
          class="nxf-hero__option"
          role="radio"
          aria-checked="true"
          data-option="a"
          type="button"
        >
          <span class="nxf-hero__radio" aria-hidden="true">
            <span class="nxf-hero__radio-dot"></span>
          </span>
          <span class="nxf-hero__option-label">Comprar o Nex Floor Nivela &amp; Primer</span>
        </button>

        <button
          class="nxf-hero__option"
          role="radio"
          aria-checked="false"
          data-option="b"
          type="button"
        >
          <span class="nxf-hero__radio" aria-hidden="true">
            <span class="nxf-hero__radio-dot"></span>
          </span>
          <span class="nxf-hero__option-label">Comprar o Kit Nex Floor</span>
        </button>

      </div>

      <!-- 4. Stepper + Comprar row -->
      <div class="nxf-hero__actions">

        <div class="nxf-hero__stepper" role="group" aria-label="Quantidade">
          <button
            class="nxf-hero__stepper-btn"
            id="nxf-minus"
            type="button"
            aria-label="Diminuir quantidade"
          >&#8722;</button>
          <span class="nxf-hero__stepper-num" id="nxf-qty" aria-live="polite" aria-atomic="true">1</span>
          <button
            class="nxf-hero__stepper-btn"
            id="nxf-plus"
            type="button"
            aria-label="Aumentar quantidade"
          >&#43;</button>
        </div>

        <button class="nxf-hero__comprar" type="button" aria-label="Comprar">
          <span class="nxf-hero__comprar-label">Comprar</span>
          <span class="nxf-hero__comprar-chevron" aria-hidden="true">&#8250;</span>
        </button>

      </div>

    </div>
  </div>

  <!-- Carousel arrows (placeholder — no-op safe) -->
  <div class="nxf-hero__arrows" aria-hidden="true">
    <button class="nxf-hero__arrow" type="button" tabindex="-1" aria-label="Anterior">&#8249;</button>
    <button class="nxf-hero__arrow" type="button" tabindex="-1" aria-label="Pr&oacute;ximo">&#8250;</button>
  </div>

</section>

<!-- secoes -->

<script>
(function() {
  // --- Guard: exit silently if root elements are missing ---
  var root = document.getElementById('nxf-root');
  if (!root) return;

  // --- Radio card single-select ---
  var options = root.querySelectorAll('.nxf-hero__option[role="radio"]');
  if (options.length) {
    options.forEach(function(btn) {
      btn.addEventListener('click', function() {
        options.forEach(function(o) { o.setAttribute('aria-checked', 'false'); });
        btn.setAttribute('aria-checked', 'true');
      });
      btn.addEventListener('keydown', function(e) {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          btn.click();
        }
      });
    });
  }

  // --- Quantity stepper ---
  var qtyEl = root.querySelector('#nxf-qty');
  var minusBtn = root.querySelector('#nxf-minus');
  var plusBtn = root.querySelector('#nxf-plus');
  if (qtyEl && minusBtn && plusBtn) {
    var qty = 1;
    plusBtn.addEventListener('click', function() {
      qty += 1;
      qtyEl.textContent = qty;
    });
    minusBtn.addEventListener('click', function() {
      if (qty > 1) { qty -= 1; qtyEl.textContent = qty; }
    });
  }
})();
</script>

</div>
