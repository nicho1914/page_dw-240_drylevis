<!-- ============================================================================
     BLOCO LANDING PAGE - NEX FLOOR (LINHA PROPISO) - FRAGMENTO WAKE
     Cole TUDO isto num bloco de conte&uacute;do HTML do Wake (modo c&oacute;digo-fonte).
     - Sem <html>/<head>/<body> (&eacute; um fragmento Wake).
     - CSS escopado em #nxf-root (nao afeta o tema da loja).
     - Acentos como entidades HTML; JS (quando houver) em ASCII puro.
     - Fontes: AmsiPro Cond via @font-face (trocar src quando os arquivos
       chegarem). Ate la, Oswald + Archivo Narrow (Google Fonts) assumem.
     - Assets de imagem/video via CDN externo; nunca .mp4 direto no Wake.
============================================================================ -->

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Archivo+Narrow:wght@400;500;700&display=swap" rel="stylesheet" />

<div id="nxf-root">
<style>

/* ---- AmsiPro Cond — trocar os src pelos arquivos reais quando chegarem.
        Ate la, o fallback condensado abaixo assume. ---- */
@font-face {
  font-family: 'AmsiPro Cond';
  font-weight: 900;
  font-display: swap;
  src: local('Oswald');
}

/* ---- Tokens + reset raiz ---- */
#nxf-root {
  --roxo:       #7B529F;
  --roxo-claro: #af619e;
  --azul:       #599ad5;
  --friso-1:    #FFCC00;
  --friso-2:    #FFED00;
  --ink:        #1f1f1f;
  --ink2:       #242424;
  --gray:       #696969;
  --lilas:      #f4eff8;
  --navy:       #23286b;
  --creme:      #f6f3ef;
  --branco:     #fff;
  --footer-ink: #ededed;

  --title: 'Oswald','AmsiPro Cond',system-ui,sans-serif;
  --body:  'Archivo Narrow','AmsiPro Cond',system-ui,sans-serif;

  font-family: var(--body);
  color: var(--ink);
  background: var(--branco);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

#nxf-root *, #nxf-root *::before, #nxf-root *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

#nxf-root img   { display: block; max-width: 100%; }
#nxf-root a     { color: inherit; text-decoration: none; }
#nxf-root button{ font-family: inherit; cursor: pointer; }

/* ---- Container ---- */
#nxf-root .wrap {
  width: 100%;
  max-width: 1432px;
  margin-inline: auto;
  padding-inline: clamp(16px, 4vw, 60px);
}

/* ================================================================
   HERO — Figma node 920:1666
   ================================================================ */

#nxf-root .nxf-hero {
  background: var(--branco);
  padding-block: clamp(40px, 6vw, 72px) clamp(32px, 5vw, 56px);
}

/* Top row: headline left / Propiso badge right */
#nxf-root .nxf-hero__top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: clamp(20px, 4vw, 48px);
  margin-bottom: clamp(32px, 4vw, 48px);
}

/* Headline */
#nxf-root .nxf-hero__title {
  font-family: var(--title);
  font-weight: 900;
  text-transform: uppercase;
  color: var(--roxo);
  font-size: clamp(36px, 6vw, 76px);
  line-height: 1.0;
  letter-spacing: -.01em;
  max-width: 760px;
}

/* Propiso badge — top-right */
#nxf-root .nxf-propiso {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  padding-top: 6px; /* optical vertical align with headline cap-height */
}

#nxf-root .nxf-propiso__dots {
  display: flex;
  gap: 5px;
  align-items: center;
}

#nxf-root .nxf-propiso__dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--azul);
  display: block;
}

#nxf-root .nxf-propiso__wordmark {
  font-family: var(--title);
  font-size: clamp(20px, 2.4vw, 30px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -.01em;
  text-transform: lowercase;
}

#nxf-root .nxf-propiso__wordmark .pro  { color: var(--azul); }
#nxf-root .nxf-propiso__wordmark .piso { color: var(--gray); }

/* 3-image row */
#nxf-root .nxf-hero__imgs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(16px, 2vw, 24px);
}

#nxf-root .nxf-hero__img {
  border-radius: 25px;
  overflow: hidden;
  aspect-ratio: 435 / 461;
  position: relative;
}

#nxf-root .nxf-hero__img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Fallback backgrounds when image 404s — token-derived, varied per slot */
#nxf-root .nxf-hero__img--1 {
  background: color-mix(in srgb, var(--roxo) 60%, var(--lilas));
}

#nxf-root .nxf-hero__img--2 {
  background: color-mix(in srgb, var(--azul) 55%, var(--lilas));
}

#nxf-root .nxf-hero__img--3 {
  background: color-mix(in srgb, var(--roxo) 30%, color-mix(in srgb, var(--azul) 40%, var(--lilas)));
}

/* Mobile: 1 column under ~720px */
@media (max-width: 720px) {
  #nxf-root .nxf-hero__top {
    flex-direction: column;
    gap: 16px;
  }

  #nxf-root .nxf-hero__title {
    font-size: clamp(28px, 9vw, 48px);
    word-break: break-word;
    hyphens: auto;
  }

  #nxf-root .nxf-propiso {
    padding-top: 0;
  }

  #nxf-root .nxf-hero__imgs {
    grid-template-columns: 1fr;
  }

  #nxf-root .nxf-hero__img {
    aspect-ratio: 16 / 9;
  }
}

/* ================================================================
   FB — SECTION TITLE + MOSAIC GALLERY
   Figma node 920:1666 (mosaic region)
   ================================================================ */

/* Section title */
#nxf-root .nxf-mosaic-section {
  padding-block: clamp(56px, 7vw, 100px) clamp(48px, 6vw, 80px);
  background: var(--branco);
}

#nxf-root .nxf-mosaic-section__title {
  font-family: var(--title);
  font-weight: 900;
  text-transform: uppercase;
  color: var(--roxo);
  font-size: clamp(28px, 4.5vw, 60px);
  line-height: 1.08;
  letter-spacing: -.01em;
  text-align: center;
  margin-bottom: clamp(36px, 5vw, 64px);
}

/* Mosaic grid — 3 cols × 3 rows, base-row ~292px */
#nxf-root .nxf-mosaic {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, clamp(180px, 20.3vw, 292px));
  gap: clamp(12px, 1.6vw, 20px);
}

/* Each mosaic block */
#nxf-root .nxf-mosaic__block {
  border-radius: 25px;
  overflow: hidden;
  position: relative;
}

#nxf-root .nxf-mosaic__block img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Tall blocks (span 2 rows) */
#nxf-root .nxf-mosaic__block--tall {
  grid-row: span 2;
}

/* Color fallbacks (token-derived, no raw opaque hex outside tokens) */

/* Explicit grid placement — guarantees masonry rhythm regardless of auto-flow */

/* Col 1, row 1 — short, neutral gray */
#nxf-root .nxf-mosaic__block--c1r1 {
  grid-column: 1;
  grid-row: 1;
  background: color-mix(in srgb, var(--ink) 35%, var(--branco));
}

/* Col 1, rows 2-3 — TALL, navy */
#nxf-root .nxf-mosaic__block--c1r2 {
  grid-column: 1;
  grid-row: 2 / span 2;
  background: var(--navy);
}

/* Col 2, row 1 — short, yellow (friso-1) — prominent accent */
#nxf-root .nxf-mosaic__block--c2r1 {
  grid-column: 2;
  grid-row: 1;
  background: var(--friso-1);
}

/* Col 2, row 2 — short, purple mix */
#nxf-root .nxf-mosaic__block--c2r2 {
  grid-column: 2;
  grid-row: 2;
  background: color-mix(in srgb, var(--roxo) 70%, var(--lilas));
}

/* Col 2, row 3 — short, light neutral */
#nxf-root .nxf-mosaic__block--c2r3 {
  grid-column: 2;
  grid-row: 3;
  background: color-mix(in srgb, var(--ink) 20%, var(--branco));
}

/* Col 3, rows 1-2 — TALL, roxo */
#nxf-root .nxf-mosaic__block--c3r1 {
  grid-column: 3;
  grid-row: 1 / span 2;
  background: var(--roxo);
}

/* Col 3, row 3 — short, azul mix */
#nxf-root .nxf-mosaic__block--c3r3 {
  grid-column: 3;
  grid-row: 3;
  background: color-mix(in srgb, var(--azul) 65%, var(--navy));
}

/* Reflow: 2 cols ≤820px — reset explicit placement, drop spans to avoid holes */
@media (max-width: 820px) {
  #nxf-root .nxf-mosaic {
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: none;
    grid-auto-rows: clamp(160px, 28vw, 260px);
    grid-auto-flow: row;
  }

  #nxf-root .nxf-mosaic__block {
    grid-column: auto !important;
    grid-row: auto !important;
  }

  #nxf-root .nxf-mosaic__block--tall {
    grid-row: auto !important;
  }
}

/* Reflow: 1 col ≤520px */
@media (max-width: 520px) {
  #nxf-root .nxf-mosaic {
    grid-template-columns: 1fr;
    grid-auto-rows: clamp(180px, 52vw, 280px);
  }
}

</style>
