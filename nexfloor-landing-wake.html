<!-- ============================================================================
     BLOCO LANDING PAGE - NEX FLOOR (LINHA PROPISO) - FRAGMENTO WAKE
     Cole TUDO isto num bloco de conte&uacute;do HTML do Wake (modo c&oacute;digo-fonte).
     - Sem <html>/<head>/<body> (&eacute; um fragmento Wake).
     - CSS escopado em #nxf-root (nao afeta o tema da loja).
     - Acentos como entidades HTML; JS (quando houver) em ASCII puro.
     - Fontes: AmsiPro Cond via @font-face (trocar src quando os arquivos
       chegarem). Ate la, Oswald + Archivo Narrow (Google Fonts) assumem.
     - Assets de imagem/video via CDN externo; nunca .mp4 direto no Wake.
============================================================================ -->

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Archivo+Narrow:wght@400;500;700&display=swap" rel="stylesheet" />

<div id="nxf-root">
<style>

/* ---- AmsiPro Cond — trocar os src pelos arquivos reais quando chegarem.
        Ate la, o fallback condensado abaixo assume. ---- */
@font-face {
  font-family: 'AmsiPro Cond';
  font-weight: 900;
  font-display: swap;
  src: local('Oswald');
}

/* ---- Tokens + reset raiz ---- */
#nxf-root {
  --roxo:       #7B529F;
  --roxo-claro: #af619e;
  --azul:       #599ad5;
  --friso-1:    #FFCC00;
  --friso-2:    #FFED00;
  --ink:        #1f1f1f;
  --ink2:       #242424;
  --gray:       #696969;
  --lilas:      #f4eff8;
  --navy:       #23286b;
  --creme:      #f6f3ef;
  --branco:     #fff;
  --footer-ink: #ededed;

  --title: 'Oswald','AmsiPro Cond',system-ui,sans-serif;
  --body:  'Archivo Narrow','AmsiPro Cond',system-ui,sans-serif;

  font-family: var(--body);
  color: var(--ink);
  background: var(--branco);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

#nxf-root *, #nxf-root *::before, #nxf-root *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

#nxf-root img   { display: block; max-width: 100%; }
#nxf-root a     { color: inherit; text-decoration: none; }
#nxf-root button{ font-family: inherit; cursor: pointer; }

/* ---- Container ---- */
#nxf-root .wrap {
  width: 100%;
  max-width: 1432px;
  margin-inline: auto;
  padding-inline: clamp(16px, 4vw, 60px);
}

/* ================================================================
   HERO — Figma node 920:1666
   ================================================================ */

#nxf-root .nxf-hero {
  background: var(--branco);
  padding-block: clamp(40px, 6vw, 72px) clamp(32px, 5vw, 56px);
}

/* Top row: headline left / Propiso badge right */
#nxf-root .nxf-hero__top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: clamp(20px, 4vw, 48px);
  margin-bottom: clamp(32px, 4vw, 48px);
}

/* Headline */
#nxf-root .nxf-hero__title {
  font-family: var(--title);
  font-weight: 900;
  text-transform: uppercase;
  color: var(--roxo);
  font-size: clamp(36px, 6vw, 76px);
  line-height: 1.0;
  letter-spacing: -.01em;
  max-width: 760px;
}

/* Propiso badge — top-right */
#nxf-root .nxf-propiso {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  padding-top: 6px; /* optical vertical align with headline cap-height */
}

#nxf-root .nxf-propiso__dots {
  display: flex;
  gap: 5px;
  align-items: center;
}

#nxf-root .nxf-propiso__dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--azul);
  display: block;
}

#nxf-root .nxf-propiso__wordmark {
  font-family: var(--title);
  font-size: clamp(20px, 2.4vw, 30px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -.01em;
  text-transform: lowercase;
}

#nxf-root .nxf-propiso__wordmark .pro  { color: var(--azul); }
#nxf-root .nxf-propiso__wordmark .piso { color: var(--gray); }

/* 3-image row */
#nxf-root .nxf-hero__imgs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(16px, 2vw, 24px);
}

#nxf-root .nxf-hero__img {
  border-radius: 25px;
  overflow: hidden;
  aspect-ratio: 435 / 461;
  position: relative;
}

#nxf-root .nxf-hero__img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Fallback backgrounds when image 404s — token-derived, varied per slot */
#nxf-root .nxf-hero__img--1 {
  background: color-mix(in srgb, var(--roxo) 60%, var(--lilas));
}

#nxf-root .nxf-hero__img--2 {
  background: color-mix(in srgb, var(--azul) 55%, var(--lilas));
}

#nxf-root .nxf-hero__img--3 {
  background: color-mix(in srgb, var(--roxo) 30%, color-mix(in srgb, var(--azul) 40%, var(--lilas)));
}

/* Mobile: 1 column under ~720px */
@media (max-width: 720px) {
  #nxf-root .nxf-hero__top {
    flex-direction: column;
    gap: 16px;
  }

  #nxf-root .nxf-hero__title {
    font-size: clamp(28px, 9vw, 48px);
    word-break: break-word;
    hyphens: auto;
  }

  #nxf-root .nxf-propiso {
    padding-top: 0;
  }

  #nxf-root .nxf-hero__imgs {
    grid-template-columns: 1fr;
  }

  #nxf-root .nxf-hero__img {
    aspect-ratio: 16 / 9;
  }
}

</style>

<!-- secoes Nex Floor (Figma) -->
<section class="nxf-hero">
  <div class="wrap">

    <!-- Top row: headline (left) + Propiso badge (right) -->
    <div class="nxf-hero__top">

      <h1 class="nxf-hero__title">
        Beleza de pedra,<br>resist&ecirc;ncia de obra.
      </h1>

      <!-- selo Propiso (placeholder CSS; trocar pelo SVG oficial) -->
      <div class="nxf-propiso" aria-label="Propiso">
        <span class="nxf-propiso__dots" aria-hidden="true">
          <span class="nxf-propiso__dot"></span>
          <span class="nxf-propiso__dot"></span>
          <span class="nxf-propiso__dot"></span>
        </span>
        <span class="nxf-propiso__wordmark">
          <span class="pro">pro</span><span class="piso">piso</span>
        </span>
      </div>

    </div><!-- /.nxf-hero__top -->

    <!-- 3-image row -->
    <div class="nxf-hero__imgs">

      <div class="nxf-hero__img nxf-hero__img--1">
        <img
          src="https://cdn.jsdelivr.net/gh/nicho1914/page_dw-240_drylevis@main/Assets/nexfloor-hero-1.png"
          alt="Ambiente com piso Nex Floor &mdash; linha Propiso" />
      </div>

      <div class="nxf-hero__img nxf-hero__img--2">
        <img
          src="https://cdn.jsdelivr.net/gh/nicho1914/page_dw-240_drylevis@main/Assets/nexfloor-hero-2.png"
          alt="Detalhe do acabamento Nex Floor Cristal" />
      </div>

      <div class="nxf-hero__img nxf-hero__img--3">
        <img
          src="https://cdn.jsdelivr.net/gh/nicho1914/page_dw-240_drylevis@main/Assets/nexfloor-hero-3.png"
          alt="Aplica&ccedil;&atilde;o Nex Floor &mdash; resist&ecirc;ncia e beleza" />
      </div>

    </div><!-- /.nxf-hero__imgs -->

  </div><!-- /.wrap -->
</section><!-- /.nxf-hero -->

</div><!-- /#nxf-root -->
